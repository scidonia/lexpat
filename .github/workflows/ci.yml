name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label (ubuntu-latest or a self-hosted label)"
        required: false
        default: "ubuntu-latest"

jobs:
  checks:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The security step compares the complete corpus tree with the base
          # revision, so the base commit must be in the checkout.
          fetch-depth: 0

      # Nix and flakes must exist before any `nix develop` command.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: "experimental-features = nix-command flakes"

      - name: build the library, proofs and C ABI artifact
        run: nix develop -c lake build

      - name: clean build from shipped sources
        run: nix develop -c bash tests/clean-build.sh

      - name: C ABI contract A1
        run: nix develop -c bash tests/c-abi-contract.sh A1

      - name: C ABI contract A2
        run: nix develop -c bash tests/c-abi-contract.sh A2

      - name: C ABI callback allocation contract A3
        run: nix develop -c bash tests/c-abi-oom-contract.sh A3

      # The fuzz targets are prepared in their own capped step so a cold build
      # fails here, with its log retained, instead of consuming the security
      # budget or hiding behind it.
      - name: prepare the fuzz build
        timeout-minutes: 15
        run: |
          mkdir -p "$RUNNER_TEMP/lexpat-fuzz-build"
          set -o pipefail
          nix develop -c bash scripts/security-fuzz-build.sh \
            --out "$RUNNER_TEMP/lexpat-fuzz-build" \
            2>&1 | tee "$RUNNER_TEMP/lexpat-fuzz-build/build.log"

      # One step covers CVE checks, the fixed differential replay, injected
      # shim OOM and the four-target fuzz smoke; the scaling sentinel is its
      # own required step below. The wrapper runs outside Nix, so its
      # 300-second deadline includes Nix startup, and it kills and reaps the
      # whole process group on timeout. Each stage keeps its own log under the
      # stages directory.
      - name: bounded security checks
        run: |
          mkdir -p "$RUNNER_TEMP/lexpat-security"
          python3 scripts/run-bounded-security.py \
            --seconds 300 --grace 5 \
            --log "$RUNNER_TEMP/lexpat-security/bounded.log" \
            -- nix develop -c bash tests/security-ci.sh \
                 --out "$RUNNER_TEMP/lexpat-security/stages" \
                 --build-dir "$RUNNER_TEMP/lexpat-fuzz-build"

      # Scaling is a timing measurement with its own classification, so it runs
      # as its own required step instead of inside the bounded security budget.
      # The helper retries one drift-inconclusive session and nothing else; a
      # second inconclusive attempt fails the step rather than calling a failed
      # measurement a pass.
      - name: scaling sentinel
        timeout-minutes: 10
        run: |
          bash tests/security-scaling-ci.sh \
            --out "$RUNNER_TEMP/lexpat-scaling"

      # Reached when preparation, the security step or the scaling step fails.
      # The preparation log is required; the wrapper and scaling logs exist once
      # their steps started, and each scaling attempt keeps its own log, CSV,
      # report and drift signal.
      - name: upload security diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lexpat-security-diagnostics
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/lexpat-fuzz-build/build.log
            ${{ runner.temp }}/lexpat-fuzz-build/build.json
            ${{ runner.temp }}/lexpat-fuzz-build/source-manifest.sha256
            ${{ runner.temp }}/lexpat-fuzz-build/targets.sha256
            ${{ runner.temp }}/lexpat-security/bounded.log
            ${{ runner.temp }}/lexpat-security/stages/**/*.log
            ${{ runner.temp }}/lexpat-scaling/attempt*.log
            ${{ runner.temp }}/lexpat-scaling/attempt-*/candidate.csv
            ${{ runner.temp }}/lexpat-scaling/attempt-*/report.txt
            ${{ runner.temp }}/lexpat-scaling/attempt-*/drift-inconclusive.signal

      - name: C ABI differential against libexpat
        run: nix develop -c python3 tests/c-abi-differential.py

      - name: C ABI header, symbol, layout and runtime verification
        run: nix develop -c python3 tests/c-abi-verify.py

      - name: C ABI memory checks
        run: nix develop -c bash tests/c-abi-memory.sh

      # Correctness-only smoke: preflight, drift and small samples. Throughput
      # thresholds are never enforced on shared runners.
      - name: performance benchmark smoke
        run: |
          nix develop -c bash tests/performance-benchmark.sh \
            --candidate-source "$GITHUB_WORKSPACE" \
            --out "$RUNNER_TEMP/lexpat-performance-smoke" \
            --phase smoke --samples 3 --warmups 1 --chunk 4096

      - name: one-shot fault precedence contract
        run: nix develop -c lake env lean --run tests/OneShotPrecedence.lean

      - name: streaming API assertions
        run: nix develop -c lake env lean --run tests/StreamingCases.lean

      - name: build the trace executable
        run: nix develop -c lake build lexpatTrace

      - name: build the raw-event driver
        run: nix develop -c lake build lexpatEvents

      - name: streaming behavior
        run: nix develop -c python3 tests/streaming.py

      - name: differential against libexpat
        run: nix develop -c python3 tests/differential.py

      - name: resource-budget cases
        run: nix develop -c python3 tests/differential.py --group limits

      - name: no admitted or unsafe definitions
        run: nix develop -c bash tests/no-admits.sh

      - name: decoder proof audit
        run: nix develop -c lake env lean LexPat/Encoding/Proofs.lean
